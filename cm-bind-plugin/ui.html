<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 12px; font-size: 12px; color: #333; }
  .bar { margin-bottom: 8px; }
  button { padding: 4px 12px; margin-right: 6px; cursor: pointer; }
  textarea { width: 100%; box-sizing: border-box; font-family: Menlo, monospace; font-size: 11px; border: 1px solid #ccc; border-radius: 4px; padding: 6px; resize: vertical; }
  #result { background: #f5f5f5; border: 1px solid #e0e0e0; border-radius: 4px; padding: 8px; margin-top: 8px; min-height: 40px; max-height: 140px; overflow: auto; white-space: pre-wrap; word-break: break-all; font-family: Menlo, monospace; font-size: 11px; }
  .ok { color: #1a7f37; } .err { color: #d1242f; }
</style>
</head>
<body>
  <div class="bar">
    <button id="loadBtn">拉取远程脚本</button>
    <button id="runBtn">执行</button>
    <button id="closeBtn">关闭</button>
  </div>
  <textarea id="code" rows="14" spellcheck="false"></textarea>
  <div id="result">就绪</div>
<script>
  const REMOTE_URL = "http://127.0.0.1:8001/remote-scripts/plugin-script.js";
  const codeEl = document.getElementById("code");
  const resultEl = document.getElementById("result");
  function setResult(t, cls) { resultEl.textContent = t; resultEl.className = cls || ""; }
  document.getElementById("loadBtn").onclick = async () => {
    setResult("拉取中...");
    try {
      const r = await fetch(REMOTE_URL + "?t=" + Date.now());
      const text = await r.text();
      codeEl.value = text;
      setResult("已拉取 " + text.length + " 字符");
    } catch (e) { setResult("拉取失败: " + (e && e.message ? e.message : e), "err"); }
  };
  document.getElementById("runBtn").onclick = () => {
    if (!codeEl.value.trim()) { setResult("脚本为空", "err"); return; }
    setResult("执行中...");
    parent.postMessage({ pluginMessage: { type: "run-script", code: codeEl.value } }, "*");
  };
  document.getElementById("closeBtn").onclick = () => {
    parent.postMessage({ pluginMessage: { type: "close" } }, "*");
  };
  onmessage = (event) => {
    const m = event.data && event.data.pluginMessage;
    if (!m || m.type !== "result") return;
    setResult((m.ok ? "✅ " : "❌ ") + m.text, m.ok ? "ok" : "err");
  };
  document.getElementById("loadBtn").click();
</script>
</body>
</html>
